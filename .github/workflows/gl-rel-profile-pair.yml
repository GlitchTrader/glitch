name: Reconcile Glitch AI profile pairing

on:
  pull_request:
  push:
    branches:
      - fix/gl-rel-01-profile-0.0.2.20

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gl-rel-01-profile-0.0.2.20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pair AI 0.0.2.7 with profile 0.0.2.20
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path("apps/download/src/lib/release-catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8-sig"))
          matches = [row for row in catalog if row.get("edition") == "ai" and row.get("version") == "0.0.2.7"]
          if len(matches) != 1:
              raise SystemExit(f"expected one AI 0.0.2.7 row, found {len(matches)}")
          row = matches[0]
          if row.get("hermesProfileVersion") != "0.0.2.19":
              raise SystemExit(f"unexpected prior profile pair: {row.get('hermesProfileVersion')}")
          row["hermesProfileVersion"] = "0.0.2.20"
          catalog_path.write_text(json.dumps(catalog, indent=4) + "\n", encoding="utf-8")

          ledger_path = Path("docs/ledger/ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          rel = next(item for item in ledger["items"] if item["id"] == "GL-REL-01")
          evidence = list(rel.get("evidence") or [])
          note = "Glitch AI 0.0.2.7 is paired with intelligence-first Hermes profile 0.0.2.20 (profile merge 0ae40d977931a0ee34191da175510a86a92cb10f)."
          if note not in evidence:
              evidence.append(note)
          rel["evidence"] = evidence
          ledger["updated"] = "2026-08-02"
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Verify release contracts
        run: |
          python -m json.tool apps/download/src/lib/release-catalog.json >/dev/null
          python -m json.tool docs/ledger/ledger.json >/dev/null
          python -m unittest discover -s tools/tests -p 'test_release*.py'
          python -m unittest discover -s tools/hermes/tests -p 'test_*release*.py'
      - name: Commit verified metadata and remove this one-shot workflow
        run: |
          rm .github/workflows/gl-rel-profile-pair.yml
          git config user.name "glitch-release-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add apps/download/src/lib/release-catalog.json docs/ledger/ledger.json .github/workflows/gl-rel-profile-pair.yml
          git commit -m "fix(release): pair AI 0.0.2.7 with profile 0.0.2.20"
          git push origin HEAD:fix/gl-rel-01-profile-0.0.2.20
