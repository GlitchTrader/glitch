name: Source contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared and lifecycle contracts
        run: python -m unittest discover -s tools/tests -p "test_*.py"
      - name: AI and Hermes contracts
        run: python -m unittest discover -s tools/hermes/tests -p "test_*.py"
